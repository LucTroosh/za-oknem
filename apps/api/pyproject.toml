[project]
name = "za-oknem-api"
version = "0.1.0"
description = "Za Oknem backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Explicit selection so upgrading ruff never silently changes what's enforced
# (today's default is just E4/E7/E9/F - too little to catch real mistakes, but
# an implicit default can also grow stricter under us with no diff to review).
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import order)
    "UP",  # pyupgrade (modern Python idioms)
    "B",   # flake8-bugbear (common bug patterns)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.lint.flake8-bugbear]
# fastapi.Depends() in an argument default is the framework's own dependency-
# injection idiom, not a mutable-default bug — this is the documented fix,
# not a suppression. https://docs.astral.sh/ruff/rules/function-call-in-default-argument/
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
markers = [
    "postgis: needs a real PostGIS database (DATABASE_URL); skipped when unavailable (ADR-019)",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Incremental tightening (item 21, hardening) - not jumping straight to --strict,
# which would demand type annotations across connector code (e.g. ingest.py's
# untyped `db` params) that isn't this task's scope. These four catch real bugs
# with near-zero false-positive risk on an otherwise loosely-typed codebase.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
