openapi: 3.1.1
info:
  title: POWIETRZE API
  description: |-
    Interfejs API udostępniający dane w zakresie monitoringu jakości powietrza
  contact:
    name: Punkt kontaktowy API
    url: https://dane.gios.gov.pl/kontakt
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
  version: 1.0.0
servers:
  - url: https://dane.gios.gov.pl/api/powietrze
tags:
  - name: Wyniki rocznych ocen jakości powietrza
    description: Wyniki rocznych ocen jakości powietrza wraz z parametrami i metadanymi oraz stężenia zanieczyszczeń uwzględnionych w ocenie jakości powietrza
  - name: Wyniki ocen wieloletnich
    description: Wyniki ocen na potrzeby ustalenia metod wykonywania rocznych ocen jakości powietrza
  - name: Raporty - oceny jakości powietrza
    description: Wyniki ocen rocznych oraz wieloletnich na potrzeby ustalenia metod wykonywania rocznych ocen jakości powietrza z możliwością pobrania dokumentu
  - name: Monitoring składu chemicznego pyłu zawieszonego PM2,5
    description: Informacje na temat monitoringu składu chemicznego pyłu zawieszonego PM2,5 w zakresie wyników pomiarów stężeń oraz wartości stężeń średnich rocznych
  - name: Metody pomiarowe
    description: Informacje o stosowaniu referencyjnych metod pomiarowych
  - name: Monitoring chemizmu opadów atmosferycznych (depozycji)
    description: Informacje z zakresu monitoringu chemizmu opadów atmosferycznych (depozycji) w zakresie metadanych, metod pomiaru oraz wyników pomiarów i średnich stężeń rocznych
  - name: Stanowiska pomiarowe
    description: Usługi zwracające listę id stanowisk (parametr stanowiskoId) na potrzeby innych usług
paths:
  /v1/wyniki-ocen-rocznych:
    get:
      tags:
        - Wyniki rocznych ocen jakości powietrza
      summary: Wyniki ocen jakości powietrza - wyniki ocen wraz z parametrami i metadanymi 
      description: Usługa sieciowa udostępniająca dane dotyczące wyników rocznych ocen jakości powietrza zgromadzone w Ekoinfonet - JPOAT 3.0, w zakresie wyników ocen wraz z parametrami i metadanymi, w tym. m.in. informacje o metodach oceny, stanowiskach pomiarowych, informacje o przekroczeniu
      operationId: getWynikiOcenRocznychV1
      parameters:
        - $ref: '#/components/parameters/numerStrony'
        - $ref: '#/components/parameters/liczbaElementowNaStronie'
        - name: ocenianyRok
          in: query
          description: Oceniany rok (rok, dla którego wykonywana jest ocena) np. 2022. – dostępne są dane od 2004 roku
          schema:
            type: integer
            minimum: 2004
            maximum: 9999
          required: true
        - name: wojewodztwo
          in: query
          description: Województwo
          schema:
            $ref: '#/components/schemas/WojewodztwoEnum'
          required: true
        - name: powiat
          in: query
          description: Powiat, np. 'Warszawa', 'wałbrzyski'
          schema:
            type: string
            maxLength: 50
        - name: gmina
          in: query
          description: Gmina, np. 'Warszawa', 'Wrocław', 'Gryfino'
          schema:
            type: string
            maxLength: 50
        - name: strefa
          in: query
          description: Strefa, np. 'aglomeracja rybnicko-jastrzębska', 'miasto Gorzów Wielkopolski', 'strefa warmińsko-mazurska'
          schema:
            type: string
            maxLength: 50
        - name: wskaznik
          in: query
          description: Wskaźnik, np. 'arsen w PM10', 'benzen', 'benzo(a)piren w PM10', 'dwutlenek azotu', 'dwutlenek siarki', 'kadm w PM10', 'nikiel w PM10', 'ołów w PM10', 'ozon', 'pył zawieszony PM10', 'pył zawieszony PM2.5', 'tlenek węgla', 'tlenki azotu'
          schema:
            type: string
            maxLength: 100
        - name: typNormy
          in: query
          description: Typ normy, np. 'Poziom alarmowy', 'Poziom celu dlugoterminowego', 'Poziom docelowy', 'Poziom dopuszczalny', 'Poziom dopuszczalny (II faza)', 'Poziom dopuszczalny (ochr. rośl.)', 'Poziom informowania'
          schema:
            type: string
            maxLength: 100
        - name: celOchrony
          in: query
          description: Cel ochrony (OZ oznacza kryterium pod kątem ochrony zdrowia ludzi, OR oznacza kryterium pod kątem ochrony roślin)
          schema:
            $ref: '#/components/schemas/PowietrzeCelOchronyEnum'
        - name: wynikOceny
          in: query
          description: "Wynik oceny rocznej, np. 'A', 'A1', 'B', 'C', 'C1', 'D1', 'D2'.<br>Ocena: A, A1, D1 oznacza brak przekroczeń; ocena C, C1, D2 oznacza przekroczenie"
          schema:
            type: string
            maxLength: 10
      responses:
        '200':
          description: Sukces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PowietrzewynikiOcenRocznychOdpowiedz'
  /v1/wyniki-ocen-stezenia:
    get:
      tags:
        - Wyniki rocznych ocen jakości powietrza
      summary: Wyniki ocen jakości powietrza - stężenia zanieczyszczeń uwzględnionych w ocenie jakości powietrza i danych uzupełniających
      description: Usługa sieciowa udostępniająca dane dotyczące wyników rocznych ocen jakości powietrza zgromadzone w Ekoinfonet - JPOAT 3.0, w zakresie dot. stężeń zanieczyszczeń uwzględnionych w ocenie i danych uzupełniających
      operationId: getWynikiOcenStezeniaV1
      parameters:
        - $ref: '#/components/parameters/numerStrony'
        - $ref: '#/components/parameters/liczbaElementowNaStronie'
        - name: rok
          in: query
          description: Rok statystyk, np. 2022
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 9999
        - name: stanowiskoId
          in: query
          description: Identyfikator stanowiska pomiarowego, np. 52 . Lista identyfikatorów stanowisk znajduje się w usłudze [Lista stanowisk monitoringu jakości powietrza](https://dane.gios.gov.pl/api/powietrze/v1/stanowisko-id)
          schema:
            type: array
            items:
              type: integer
              minimum: 0
      responses:
        '200':
          description: Sukces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PowietrzeWynikiOcenStezeniaOdpowiedz'
  /v1/wyniki-ocen-wieloletnich:
    get:
      tags:
        - Wyniki ocen wieloletnich
      summary: Wyniki ocen na potrzeby ustalenia metod wykonywania rocznych ocen jakości powietrza
      description: Usługa sieciowa udostępniająca wyniki ocen na potrzeby ustalenia metod wykonywania rocznych ocen jakości powietrza (tzw. ocen wieloletnich)
      operationId: getWynikOcenWieloletnichV1
      parameters:
        - $ref: '#/components/parameters/numerStrony'
        - $ref: '#/components/parameters/liczbaElementowNaStronie'
        - name: zakresLat
          in: query
          description: Zakres lat objętych oceną, np. '2019 - 2023'. Dane udostępniane w zakresach od 2009 roku (zakres lat '2009 - 2013') 
          schema:
            type: string
            maxLength: 11
          required: true
        - name: wojewodztwo
          in: query
          description: Województwo
          schema:
            $ref: '#/components/schemas/WojewodztwoEnum'
        - name: strefa
          in: query
          description: Strefa, np. 'aglomeracja rybnicko-jastrzębska', 'miasto Gorzów Wielkopolski', 'strefa warmińsko-mazurska'
          schema:
            type: string
            maxLength: 50
        - name: wskaznik
          in: query
          description: Wskaźnik, np. arsen w 'PM10', 'benzen', 'benzo(a)piren w PM10', 'dwutlenek azotu', 'dwutlenek siarki', 'kadm w PM10', 'nikiel w PM10', 'ołów w PM10', 'ozon', 'pył zawieszony PM10', 'pył zawieszony PM2.5', 'tlenek węgla', 'tlenki azotu'
          schema:
            type: string
            maxLength: 100
        - name: celOchrony
          in: query
          description: Cel ochrony (OZ oznacza kryterium pod kątem ochrony zdrowia ludzi, OR oznacza kryterium pod kątem ochrony roślin)
          schema:
            $ref: '#/components/schemas/PowietrzeCelOchronyEnum'
      responses:
        '200':
          description: Sukces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PowietrzeWynikiOcenWieloletnichOdpowiedz'
