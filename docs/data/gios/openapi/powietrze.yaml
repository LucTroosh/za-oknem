      operationId: getDokumentV1
      parameters:
        - name: id
          in: path
          description: Identyfikator pliku
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
        - name: format
          in: query
          description: Format pliku
          required: true
          schema:
            $ref: '#/components/schemas/FormatPlikuEnum'
      responses:
        '200':
          description: Sukces
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      wynik:
                        $ref: '#/components/schemas/WynikTyp'
                  - type: object
            application/pdf:
              schema:
                type: string
                format: binary
