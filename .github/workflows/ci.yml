name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --dev
      - run: uv run ruff --version
      - run: uv run ruff check --output-format=github .
      - run: uv run mypy app
      - run: uv run pytest

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Lint (with annotations)
        run: |
          npx eslint . --format json --output-file /tmp/eslint.json 2> /tmp/eslint.stderr
          echo "eslint exit code: $?" || true
        continue-on-error: true
        id: eslint_run
      - name: Report lint results
        run: |
          if [ ! -s /tmp/eslint.json ]; then
            while IFS= read -r line; do
              echo "::error::eslint crash: $line"
            done < /tmp/eslint.stderr
            exit 1
          fi
          node -e '
            const results = require("/tmp/eslint.json");
            let hasError = false;
            for (const r of results) {
              for (const m of r.messages) {
                hasError = true;
                const level = m.severity === 2 ? "error" : "warning";
                console.log(`::${level} file=${r.filePath},line=${m.line || 1},col=${m.column || 1}::${m.ruleId || ""} ${m.message}`);
              }
            }
            process.exit(hasError ? 1 : 0);
          '
      - run: npm run typecheck
