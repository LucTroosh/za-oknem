name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: za_oknem
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # No committed uv.lock yet (see note in root README/CLAUDE.md follow-up) -
          # pyproject.toml is the next best cache key.
          cache-dependency-glob: apps/api/pyproject.toml
      - run: uv sync --dev
      - run: uv run ruff --version
      - run: uv run ruff check --output-format=github .
      - name: alembic upgrade head
        run: uv run alembic upgrade head
      - name: alembic check (fails if models drifted from migrations - rule #4)
        run: |
          uv run alembic check 2>&1 | tee /tmp/alembic-check.out
        continue-on-error: true
        id: alembic_check
      - name: Report alembic check failure
        if: steps.alembic_check.outcome == 'failure'
        run: |
          while IFS= read -r line; do
            echo "::error::alembic check: $line"
          done < /tmp/alembic-check.out
          exit 1
      - name: mypy (with error annotations)
        run: |
          uv run mypy app 2>&1 | tee /tmp/mypy.out
        continue-on-error: true
        id: mypy
      - name: Report mypy failure
        if: steps.mypy.outcome == 'failure'
        run: |
          while IFS= read -r line; do
            echo "::error::mypy: $line"
          done < /tmp/mypy.out
          exit 1
      - name: pytest (with error annotations)
        run: |
          uv run pytest 2>&1 | tee /tmp/pytest.out
        continue-on-error: true
        id: pytest
      - name: Report pytest failure
        if: steps.pytest.outcome == 'failure'
        run: |
          while IFS= read -r line; do
            echo "::error::pytest: $line"
          done < /tmp/pytest.out
          exit 1

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # actions/setup-node's built-in npm cache requires a committed
          # package-lock.json (none exists yet - separate gap from this task).
          # Caching npm's own download cache dir directly works without one.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('apps/mobile/package.json') }}
          restore-keys: ${{ runner.os }}-npm-
      - name: npm install (with error annotations)
        run: |
          npm install 2> /tmp/npm-install.stderr
        continue-on-error: true
        id: npm_install
      - name: Report npm install failure
        if: steps.npm_install.outcome == 'failure'
        run: |
          while IFS= read -r line; do
            echo "::error::npm install: $line"
          done < /tmp/npm-install.stderr
          exit 1
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
