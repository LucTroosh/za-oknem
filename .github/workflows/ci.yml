name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --dev
      - run: uv run ruff --version
      - run: uv run ruff check --output-format=github .
      - run: uv run mypy app
      - name: pytest (with error annotations)
        run: |
          uv run pytest 2>&1 | tee /tmp/pytest.out
        continue-on-error: true
        id: pytest
      - name: Report pytest failure
        if: steps.pytest.outcome == 'failure'
        run: |
          while IFS= read -r line; do
            echo "::error::pytest: $line"
          done < /tmp/pytest.out
          exit 1

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm install (with error annotations)
        run: |
          npm install 2> /tmp/npm-install.stderr
        continue-on-error: true
        id: npm_install
      - name: Report npm install failure
        if: steps.npm_install.outcome == 'failure'
        run: |
          while IFS= read -r line; do
            echo "::error::npm install: $line"
          done < /tmp/npm-install.stderr
          exit 1
      - run: npm run lint
      - run: npm run typecheck
